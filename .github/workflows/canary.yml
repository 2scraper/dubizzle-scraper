name: canary

# tests.yml (deliberately) never touches dubizzle.com — see its own header
# for why. That leaves a real gap: a markup change on the site itself only
# shows up when a user hits it and files an issue, while the offline badge
# stays green throughout. This workflow is the other half — a real run
# against a real listing URL — so a site-side break is caught here first.
#
# THIS CANARY NEEDS A UAE EXIT, AND THAT IS NOT PESSIMISM.
# -------------------------------------------------------
# dubizzle is fronted by Imperva, and what it refuses is the ADDRESS — its
# COUNTRY specifically. Measured 2026-09-14, same URL throughout:
#
#   curl, full browser header set, European residential   403, 1,160 bytes
#   HEADFUL Chrome, European residential                  403, 885-1,196 bytes
#   requests + browser UA, UAE residential                200, 6,183 bytes,
#                                                         "Pardon Our Interruption"
#   2Captcha Scraper API (no browser), Finnish datacentre 200, 1,152 bytes,
#                                                         "Pardon Our Interruption"
#   HEADLESS Chromium over CDP, UAE residential           200, 1.6 MB, full grid
#
# Read it by column: the window changes nothing and the exit country changes
# everything. Note the third and fourth rows — **a refusal here can be HTTP
# 200**, so neither this workflow nor the scraper may trust the status code.
#
# A plain GitHub runner is not in the UAE, so this canary gates on a
# DUBIZZLE_CDP_ENDPOINT secret whose login carries `country-ae`. A proxy
# secret with `region-ae` would work as well; the CDP path is the one
# measured here.
#
# The live steps are SKIPPED, not failed, when the secret is absent. The job
# goes green with a notice saying why. A check that is always red teaches
# everyone to ignore checks, which is worse than having no check at all. Set
# the secret and the same workflow starts doing real work with no edit:
#
#     gh secret set DUBIZZLE_CDP_ENDPOINT --repo 2scraper/dubizzle-scraper
#
# Use a `pid` reserved for CI. A profile allows ONE live connection, so a
# canary sharing a pid with a person's run gets `profile_locked` (exit 5) and
# reports a failure that has nothing to do with the site. This was measured
# while building the repo: a second connection to a live pid timed out for
# twenty minutes.
#
# The secret is passed through the ENVIRONMENT, which env_config.py reads for
# exactly this variable, rather than through a --cdp-endpoint flag. Two
# reasons: a credential on a command line is readable by anything that can
# run `ps`, which is the rule this repo states and should therefore follow in
# its own CI; and an unset secret arrives as an empty string, which the
# loader already treats as "not configured", so there is no commented-out
# line for someone to forget to uncomment.
#
# ON DEMAND, NOT ON A SCHEDULE — forced by the credential rather than chosen.
# A Scraping Browser endpoint on these accounts does not survive long: of the
# credentials inherited from the sibling repos in this family, most were
# already returning 401 when this repo was written. A daily cron against a
# credential with that lifetime produces one of two useless outcomes: a red
# badge every day, or a green badge every day that has tested nothing. The
# second is the more dangerous, because green reads as "the parser still
# works".
#
# Put the schedule back the day a long-lived credential exists:
#     schedule:
#       - cron: "23 6 * * *"
on:
  workflow_dispatch:

jobs:
  live-run:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if`, so presence is tested
    # through the job environment and read in each step's `if`.
    env:
      HAVE_CDP: ${{ secrets.DUBIZZLE_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Explain a skipped run
        if: env.HAVE_CDP != 'true'
        run: |
          echo "::notice::Skipping the live run: no DUBIZZLE_CDP_ENDPOINT secret is set."
          echo "Imperva refuses this site to any exit outside the UAE - a European"
          echo "residential address got HTTP 403 and a Finnish datacentre address"
          echo "got a 'Pardon Our Interruption' page under HTTP 200. A GitHub"
          echo "runner is neither, so a run from here would be red every time"
          echo "whatever the state of the code. Set a Scraping Browser API"
          echo "endpoint with country-ae in its login (and a pid reserved for CI)"
          echo "to turn this canary on:"
          echo
          echo "    gh secret set DUBIZZLE_CDP_ENDPOINT --repo 2scraper/dubizzle-scraper"
          echo
          echo "The offline suite (tests.yml) covers everything that does not"
          echo "need the network, and it runs on every push."

      - uses: actions/setup-python@v5
        if: env.HAVE_CDP == 'true'
        with:
          python-version: "3.12"

      - name: Install the Playwright client
        if: env.HAVE_CDP == 'true'
        # No `playwright install chromium`: with --cdp-endpoint the browser is
        # remote, so downloading a local one would add minutes and a gigabyte
        # to every run for nothing.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt

      - name: Scrape a real, known-good listing
        id: run
        if: env.HAVE_CDP == 'true'
        # A MOTORS listing, and the choice is deliberate on three counts:
        #
        #  * it is the vertical that publishes the most — it is the only one
        #    with a JSON-LD ItemList AND a payload AND rendered price nodes,
        #    so a break in any of the three shows up here;
        #  * it prices every row (26/26 measured), so a price floor means
        #    something — which it would not on /jobs/, where 0 of 25 rows
        #    carry a price and that is correct;
        #  * it is deep enough that three pages are never the end of it
        #    (34,619 ads, 400 pages), so `pages_completed` is a real check
        #    rather than an accident of a short catalogue.
        #
        # --pages 3, not 1: with one page pagination is never exercised, so a
        # broken ?page= convention would stay invisible here — precisely the
        # silent decay this workflow exists to catch.
        #
        # --retries 4: the first live run of this engine had page 1 come back
        # blocked and cleared it on one re-fetch. The engine's own block-retry
        # budget covers that; this leaves headroom.
        #
        # set +e: GitHub Actions runs `run:` steps as `bash -e`, so without
        # this a non-zero scraper exit aborts the script on THAT line and the
        # `echo "exit_code=$?"` below never runs. continue-on-error only stops
        # the step from failing the job; it does not touch the shell's errexit.
        continue-on-error: true
        env:
          DUBIZZLE_CDP_ENDPOINT: ${{ secrets.DUBIZZLE_CDP_ENDPOINT }}
        run: |
          set +e
          python3 playwright_scraper.py \
            --url "https://uae.dubizzle.com/motors/used-cars/" \
            --pages 3 --retries 4 --out canary_run --dump-html canary_run.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the exit code
        id: verdict
        if: env.HAVE_CDP == 'true'
        # ACCESS CONDITIONS ARE NOT DEFECTS, and on this site that
        # distinction decides whether the badge means anything.
        #
        # Failing the job on ANY non-zero exit makes the canary red for two
        # things that are nobody's bug:
        #
        #   * the SECRET EXPIRED. A Scraping Browser credential is not
        #     forever. When it stops authenticating the run exits 5.
        #   * ACCESS IS INTERMITTENT PER PROFILE, and a profile allows one
        #     live connection. A canary that collides with a person's run
        #     exits 5 with `profile_locked`, which says nothing about the
        #     site or the code.
        #
        # So: 3 (blocked), 5 (remote API error) and 6 (partial) are reported
        # as WARNINGS and do not fail the job. What stays red is a run that
        # got in and found the wrong thing, or one that broke:
        #
        #   1  crashed
        #   2  the workflow's own arguments are wrong
        #   4  served a page and parsed ZERO rows from a motors listing that
        #      holds 25 ads per page — the payload action or the tile anchor
        #      moved, which is exactly what this canary exists to catch
        #
        # A warning must not read as a pass, either. Each one writes to the
        # step summary as well, so the run page says in words that the canary
        # did not actually test anything this time.
        run: |
          set -e
          code="${{ steps.run.outputs.exit_code }}"
          tested=true
          case "$code" in
            0)
              echo "OK — ads parsed from a live run." ;;
            3)
              tested=false
              echo "::warning::Blocked before parsing (exit 3) — an ACCESS condition, not a code defect, so this run is not failed. On this site a block means the exit is not in the UAE: check that country-ae is in the endpoint's login. There is no challenge on the page to solve and no captcha key would help."
              echo "### Canary did NOT test anything (exit 3, blocked)" >> "$GITHUB_STEP_SUMMARY"
              echo "The site did not serve the request, so the parser was not exercised. This is access, not a regression — the first thing to check is the exit's COUNTRY, not the browser." >> "$GITHUB_STEP_SUMMARY" ;;
            5)
              tested=false
              echo "::warning::Remote API error (exit 5) — the Scraping Browser endpoint refused the connection, so nothing was tested and this run is not failed. If the log says 'profile_locked', another run still holds this pid: give CI its own. Otherwise the DUBIZZLE_CDP_ENDPOINT secret has most likely expired and needs refreshing."
              echo "### Canary did NOT test anything (exit 5, endpoint refused)" >> "$GITHUB_STEP_SUMMARY"
              echo "The most likely cause is an expired \`DUBIZZLE_CDP_ENDPOINT\` secret. Refresh it, or remove it to go back to the explicit SKIP path." >> "$GITHUB_STEP_SUMMARY" ;;
            6)
              tested=false
              echo "::warning::Partial run (exit 6) — some pages were gathered and the run then stopped early. canary_run.meta.json names which pages failed. Not failed, because on this site that is usually an access condition; if it repeats on every run, suspect pagination instead."
              echo "### Canary tested only PART of the run (exit 6)" >> "$GITHUB_STEP_SUMMARY"
              echo "See \`pages_failed\` in the sidecar artefact." >> "$GITHUB_STEP_SUMMARY" ;;
            4)
              echo "::error::Ran fine but parsed 0 rows (exit 4) on a motors listing that holds 25 ads per page. Either the Redux action the payload lives in (listings/fetchListingDataForQuery/fulfilled) or the ad-URL pattern the DOM fallback anchors on has moved — this is the regression this canary exists to catch. The HTML dump in the artefacts tells you which."
              exit 1 ;;
            2)
              echo "::error::Bad usage (exit 2) — the workflow's own arguments are wrong, not the site."
              exit 1 ;;
            *)
              echo "::error::Unexpected exit code $code (see the step above for the traceback)."
              exit 1 ;;
          esac
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Sanity-check the scraped data
        # Only when the run actually got in. On a blocked or refused run
        # there is no output file to check, and a missing file would fail for
        # the wrong reason.
        if: env.HAVE_CDP == 'true' && steps.verdict.outputs.tested == 'true'
        # Exit 0 only means "some rows were written". It says nothing about
        # whether the page actually rendered: a snapshot taken too early
        # still writes rows, just with fields empty. Every floor below is set
        # from a measured figure and deliberately under it, so this fails on
        # a collapse rather than on normal variation.
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          PAGES_REQUESTED = 3
          PER_PAGE = 25          # motors; property pages hold 35
          # Three pages is 75 organic ads plus up to 3 promoted slots. The
          # floor is under two pages' worth, so a short page cannot trip it
          # but a collapse can.
          MIN_ROWS = 60

          rows = json.loads(Path("canary_run.json").read_text())
          meta = json.loads(Path("canary_run.meta.json").read_text())
          fail = []

          if len(rows) < MIN_ROWS:
              fail.append(f"only {len(rows)} rows, expected about "
                          f"{PAGES_REQUESTED * PER_PAGE} across "
                          f"{PAGES_REQUESTED} pages")

          skus = [r.get("sku") for r in rows]
          if len(set(skus)) != len(skus):
              fail.append(f"{len(skus) - len(set(skus))} duplicate sku(s) - the "
                          f"dedupe is not running")

          # A motors page prices every ad: 26 of 26 on the captured page and
          # on both pages of the live run. A floor is meaningful HERE, and
          # would not be on /jobs/ where 0 of 25 is correct — which is why
          # the canary URL is a motors listing.
          priced = sum(1 for r in rows if r.get("price") is not None)
          if rows and priced / len(rows) < 0.90:
              fail.append(f"only {priced}/{len(rows)} rows carry a price; every "
                          f"measured motors page priced every ad, so the price "
                          f"read has most likely broken")

          # A row with no price must carry no currency, and vice versa. A
          # missing currency is null, never a default (§4).
          mismatched = [r.get("sku") for r in rows
                        if (r.get("price") is None) != (r.get("currency") is None)]
          if mismatched:
              fail.append(f"{len(mismatched)} row(s) have a price without a "
                          f"currency or the reverse: {mismatched[:3]}")
          currencies = {r.get("currency") for r in rows if r.get("currency")}
          if currencies - {"AED"}:
              fail.append(f"rows carry a currency other than AED "
                          f"({sorted(currencies)})")

          # Both sources have to be present on motors: the payload for
          # everything and the page's JSON-LD for brand, seller and
          # availability. If the join breaks, every row silently drops to
          # `next_data` and three columns empty — which is exactly what an
          # Arabic run did before the join was keyed on the path.
          sources = {r.get("price_source") for r in rows}
          if sources - {"next_data+jsonld", "next_data", "dom",
                        "next_data+jsonld:no-price", "next_data:no-price"}:
              fail.append(f"rows carry an unknown price_source {sorted(sources)}")
          if "next_data+jsonld" not in sources:
              fail.append("no row has price_source 'next_data+jsonld' - the "
                          "JSON-LD join has broken, so brand, seller_name and "
                          "in_stock are silently empty")

          # Fully populated on every measured motors run. Any of them
          # collapsing means an anchor moved.
          for field, floor in (("title", 0.98), ("sku", 1.0), ("url", 1.0),
                               ("category", 1.0), ("listing_kind", 1.0),
                               ("vertical", 1.0), ("listing_id", 1.0),
                               ("listing_uuid", 1.0), ("short_url", 0.98),
                               ("city", 0.98), ("location", 0.98),
                               ("brand", 0.95), ("attributes", 0.95),
                               ("posted_at", 0.98), ("bumped_at", 0.98),
                               ("image_url", 0.95), ("year", 0.90),
                               ("kilometers", 0.90),
                               ("page", 1.0), ("position", 1.0)):
              got = sum(1 for r in rows if r.get(field) not in (None, ""))
              if rows and got / len(rows) < floor:
                  fail.append(f"{field} present on only {got}/{len(rows)} rows "
                              f"(floor {floor:.0%})")

          # Columns this site does not publish on an ad at all. A listing row
          # carrying one is claiming a fact its page does not state.
          for field in ("rating", "review_count"):
              got = sum(1 for r in rows if r.get(field) is not None)
              if got:
                  fail.append(f"{got}/{len(rows)} rows have `{field}`, which "
                              f"this site publishes on a SELLER's profile and "
                              f"never on an ad")
          # Property-only columns on a motors run mean the wrong vertical's
          # reader ran.
          for field in ("bedrooms", "bathrooms", "size_sqft",
                        "payment_frequency"):
              got = sum(1 for r in rows if r.get(field) is not None)
              if got:
                  fail.append(f"{got}/{len(rows)} motors rows have `{field}`, "
                              f"which only a property ad publishes")

          # §4's guard, one line, and it catches the regression forever.
          bad = [r.get("sku") for r in rows
                 if r.get("original_price") is not None
                 and r.get("price") is not None
                 and r["original_price"] <= r["price"]]
          if bad:
              fail.append(f"{len(bad)} row(s) have an original_price at or "
                          f"below their price: {bad[:3]}")
          neg = [r.get("sku") for r in rows
                 if r.get("discount_pct") is not None and r["discount_pct"] <= 0]
          if neg:
              fail.append(f"{len(neg)} row(s) have a zero or negative "
                          f"discount: {neg[:3]}")

          # sku is the ad's PATH here, not an id — see the README for why.
          bad_sku = [r.get("sku") for r in rows
                     if not (r.get("sku") or "").startswith("/")]
          if bad_sku:
              fail.append(f"{len(bad_sku)} sku(s) are not a listing path: "
                          f"{bad_sku[:3]}")
          # An ad's URL is on an emirate subdomain, never on the browse host.
          bad_url = [r.get("sku") for r in rows
                     if "uae.dubizzle.com" in (r.get("url") or "")
                     or ".dubizzle.com" not in (r.get("url") or "")]
          if bad_url:
              fail.append(f"{len(bad_url)} row(s) have a URL that is not an ad "
                          f"on an emirate subdomain: {bad_url[:3]} - the URL is "
                          f"being rebuilt instead of read")

          # The promoted slot must be labelled. If it stops being, it merges
          # into the results and repeats on every page of every run.
          kinds = {r.get("listing_kind") for r in rows}
          if kinds - {"organic", "car_of_the_week"}:
              fail.append(f"unknown listing_kind(s) {sorted(kinds)}")
          if "car_of_the_week" not in kinds:
              fail.append("no row is labelled car_of_the_week - every motors "
                          "page carries one, so the promoted slot is being "
                          "passed off as a result")

          # `position` restarts at 1 on each page, so the pair is the key.
          pairs = [(r.get("page"), r.get("position")) for r in rows]
          if len(set(pairs)) != len(pairs):
              fail.append(f"{len(pairs) - len(set(pairs))} row(s) share a "
                          f"page+position pair - the page number is not being "
                          f"threaded through the parser")

          # The point of running more than one page.
          if meta.get("pages_completed", 0) < PAGES_REQUESTED:
              fail.append(f"pagination stopped after {meta.get('pages_completed')} "
                          f"of {PAGES_REQUESTED} pages (stop_reason="
                          f"{meta.get('stop_reason')!r}) - the ?page= convention "
                          f"or the site's own rel=next has broken")
          pages_seen = {r.get("page") for r in rows}
          if len(pages_seen) < PAGES_REQUESTED:
              fail.append(f"rows came from only {sorted(pages_seen)} - a page was "
                          f"fetched but contributed nothing")
          if meta.get("status") != "complete":
              fail.append(f"run status is {meta.get('status')!r}, not 'complete'")
          if meta.get("mode") != "listing":
              fail.append(f"run mode is {meta.get('mode')!r}, not 'listing'")

          # There is no scroll to check, and that is measured rather than
          # forgotten: captures taken with no scrolling carried the same
          # counts as captures taken with four rounds. The assertion is the
          # other way round — a scroll trace appearing here would mean an
          # engine grew a loop back and is buying latency for nothing.
          if meta.get("scroll"):
              fail.append("the sidecar records a scroll trace - no page kind on "
                          "this site needs one, so an engine has grown a loop "
                          "back")

          for line in fail:
              print(f"::error::{line}")
          print(f"[canary] {len(rows)} rows, {priced} priced "
                f"({100 * priced // max(len(rows), 1)}%), "
                f"kinds={sorted(k for k in kinds if k)}, "
                f"status={meta.get('status')}, "
                f"pages={meta.get('pages_completed')}/{PAGES_REQUESTED}, "
                f"currency={sorted(currencies)}")
          sys.exit(1 if fail else 0)
          EOF

      - name: Upload run artifacts (output, HTML snapshot, debug dumps)
        # Always, not just on failure: a run that returns the WRONG numbers
        # with no error is exactly the regression that needs the actual bytes
        # the parser saw, not a pass/fail badge.
        if: always() && env.HAVE_CDP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-run-${{ github.run_id }}
          path: |
            canary_run.json
            canary_run.csv
            canary_run.meta.json
            canary_run.html*
            canary_run_page*_debug.*
          if-no-files-found: ignore
          retention-days: 14
