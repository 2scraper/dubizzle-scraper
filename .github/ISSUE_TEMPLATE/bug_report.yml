name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Everything exit 3?** Check the exit's **country** before you check
          anything else. Imperva refuses this site to any address outside the
          UAE — measured HTTP 403 from a European residential exit and a
          "Pardon Our Interruption" page under HTTP **200** from a Finnish
          datacentre exit, headful and headless alike, against HTTP 200 and
          the full catalogue from a UAE residential exit with a HEADLESS
          browser. Use `--proxy` with `region-ae`, or `--cdp-endpoint` with
          `country-ae`. The window is not the variable here.
        - **`price` null on some rows?** Check which vertical. A **jobs** ad
          publishes no salary at all (0 of 25 measured) and a **community**
          services ad usually publishes no fee (1 of 25); those rows say so
          with a `price_source` ending in `:no-price`. A null price on
          motors, property or classified is worth this issue.
        - **Zero rows?** You may be on a page that has none: a **hub** URL
          (`https://uae.dubizzle.com/`, `/motors/`) carries category tiles and
          no result grid, and one page past the end of a listing answers 200
          with `totalHits: 0` — and still draws one promoted ad, which this
          scraper deliberately does not parse. Both are exit 4 and correct
          answers. See [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **`rating` and `review_count` empty on every row?** Expected: this
          site rates SELLERS on their profile page and never the individual
          ad. The two columns are kept because the family's schema has them.
        - **`bedrooms` empty on a car, `kilometers` empty on a flat?**
          Expected — that is the vertical, not a parse failure, which is why
          `vertical` is a column.
        - **The run stopped short of the catalogue?** That is the site's own
          cap. A motors listing of 34,619 ads publishes 400 pages of 25, so
          two thirds of it is unreachable through pagination; the run reports
          how many pages are beyond the cap. Narrow it with the site's own
          filters and run each slice.
        - **Wrong language?** The language is a path segment (`/ar/`), not
          something the exit IP decides. Prices are AED for every visitor.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        challenge page, 4 is "ran fine, found nothing", 124 is a self-imposed
        timeout. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --url "https://uae.dubizzle.com/motors/used-cars/" \
          --pages 3 --out grills
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        96 products, as the README says a category page yields.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
